services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-krushimart}
      POSTGRES_USER: ${POSTGRES_USER:-krushimart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krushimart_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-krushimart} -d ${POSTGRES_DB:-krushimart}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ai:
    build:
      context: .
      dockerfile: deployment/ai.Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-krushimart}
      DB_USERNAME: ${POSTGRES_USER:-krushimart}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-krushimart_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-before-any-shared-deployment-32chars}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_ENABLED: ${AI_SERVICE_ENABLED:-true}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/products?size=1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deployment/frontend.Dockerfile
      args:
        VITE_USE_MOCKS: "false"
        VITE_API_BASE_URL: /api
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
